[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "kedi-playground"
version = "0.1.0"
description = "Browser-first playground for the Kedi language"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Mert Sırakaya", email = "mert@kedi-lang.org"},
    {name = "Doğukan Yiğit Polat", email = "yigit@neurograph.net"},
]
# PyPI shows only the first author and the first maintainer, so the two lists differ in order.
maintainers = [
    {name = "Doğukan Yiğit Polat", email = "yigit@neurograph.net"},
    {name = "Mert Sırakaya", email = "mert@kedi-lang.org"},
]
dependencies = [
    "kedi[playground]>=0.4,<0.5",
    "pydantic-monty==0.0.21",
]

[project.scripts]
kedi-playground = "playground.server:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.15.16",
]

[tool.hatch.build]
include = [
    "src/playground/**/*.py",
    "src/playground/static/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/playground"]

[tool.uv.sources]
kedi = { git = "https://github.com/kedi-lang/kedi.git", rev = "4b01d2a3d5489a79f260ef8aa9cffa557c444810" }

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["playground"]

[tool.coverage.report]
show_missing = true
